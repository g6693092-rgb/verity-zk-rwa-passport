version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verity-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      VECHAIN_TESTNET_RPC: https://rpc-testnet.vechain.energy
      VECHAIN_MAINNET_RPC: https://rpc-mainnet.vechain.energy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: verity-ui
    ports:
      - "3001:3001"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:3000
    volumes:
      - ./ui:/app
      - /app/node_modules
    command: npm start
